[server]
# Streamlit Cloud에서 패키지(reportlab, kaleido, scikit-learn 등)가 많아지면
# 기본 파일 감시 방식(inotify 기반)이 리눅스 감시 한도를 넘어서 앱이 아예
# 못 뜨는 경우가 있음. polling 방식으로 바꿔서 이 문제를 피한다.
fileWatcherType = "poll"

[theme]
font = "sans-serif"
baseRadius = "medium"

[theme.light]
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#FFFFFF"
primaryColor = "#4F46E5"
textColor = "#1A1A2E"
borderColor = "#E5E5EF"

[theme.light.sidebar]
backgroundColor = "#26224F"
secondaryBackgroundColor = "#332E68"
primaryColor = "#4F46E5"
textColor = "#FFFFFF"

[theme.dark]
backgroundColor = "#13112B"
secondaryBackgroundColor = "#1C1A3A"
primaryColor = "#6D5EF0"
textColor = "#EDEBFB"
borderColor = "#2A2850"

[theme.dark.sidebar]
backgroundColor = "#1C1A3A"
secondaryBackgroundColor = "#26224F"
primaryColor = "#6D5EF0"
textColor = "#FFFFFF"
